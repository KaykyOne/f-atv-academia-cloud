<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcademiaCloud</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body><header><span>ESTUDO DE CASO · DOCKER + NUVEM</span><h1>AcademiaCloud</h1><p>Alunos, disciplinas e matrículas em uma aplicação integrada.</p></header><main><div id="message" role="status" aria-live="polite"></div><section class="stats" aria-label="Resumo"><article><strong id="n-alunos">—</strong>Alunos</article><article><strong id="n-disciplinas">—</strong>Disciplinas</article><article><strong id="n-matriculas">—</strong>Matrículas</article></section>
<section><h2>Alunos</h2><form id="alunos"><label>Nome<input name="nome" required minlength="2" maxlength="100"></label><label>E-mail<input name="email" type="email" required maxlength="160"></label><button>Cadastrar aluno</button></form><div class="table"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Ação</th></tr></thead><tbody id="list-alunos"></tbody></table></div></section>
<section><h2>Disciplinas</h2><form id="disciplinas"><label>Nome<input name="nome" required minlength="2" maxlength="100"></label><label>Carga horária<input name="carga_horaria" type="number" min="1" max="1000" value="40" required></label><button>Cadastrar disciplina</button></form><div class="table"><table><thead><tr><th>Disciplina</th><th>Horas</th><th>Ação</th></tr></thead><tbody id="list-disciplinas"></tbody></table></div></section>
<section><h2>Matrículas</h2><form id="matriculas"><label>Aluno<select name="aluno_id" id="select-aluno" required></select></label><label>Disciplina<select name="disciplina_id" id="select-disciplina" required></select></label><button>Matricular</button></form><div class="table"><table><thead><tr><th>Aluno</th><th>Disciplina</th><th>Ação</th></tr></thead><tbody id="list-matriculas"></tbody></table></div></section>
<footer>Base didática · Utilize dados fictícios. <span id="instance"></span></footer></main></body></html>
