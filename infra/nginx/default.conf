# Balanceador do AcademiaCloud (Grupo 4) + proteções de borda (Grupo 3).
# Única porta publicada no computador. As réplicas `web` ficam só na rede interna.

# DNS interno do Docker: "web" resolve para o IP de TODAS as réplicas.
# valid=2s faz o Nginx reler os IPs a cada 2 s: réplicas recriadas (redeploy)
# ganham IPs novos, e um intervalo curto encurta a janela de 502 após o deploy.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream academia_web {
    zone academia_web 64k;               # memória compartilhada exigida por "resolve"
    # max_fails/fail_timeout: verificação PASSIVA. Após 1 falha de conexão a réplica
    # sai da rotação por 10 s; depois o Nginx tenta de novo.
    server web:8000 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

# Limite de tentativas de login por IP (complementa o bloqueio por usuário da aplicação).
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

log_format balanceador '$remote_addr "$request" status=$status upstream=$upstream_addr '
                       'upstream_status=$upstream_status tempo=$request_time';

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;
    access_log /dev/stdout balanceador;

    # Mostra qual réplica respondeu (útil na demonstração).
    add_header X-Upstream $upstream_addr always;

    location = /lb/health {               # saúde do próprio balanceador
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://academia_web;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        proxy_pass http://academia_web;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
