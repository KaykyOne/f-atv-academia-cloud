# MODELO de Secret. NÃO coloque senhas reais em arquivos versionados.
# Crie de verdade com:
#   kubectl -n academia-cloud create secret generic academia-secrets \
#     --from-literal=POSTGRES_ADMIN_PASSWORD=... --from-literal=APP_DB_PASSWORD=... (etc.)
# Em nuvem, prefira um cofre (AWS Secrets Manager, Azure Key Vault, GCP Secret Manager).
apiVersion: v1
kind: Secret
metadata:
  name: academia-secrets
  namespace: academia-cloud
type: Opaque
stringData:
  POSTGRES_ADMIN_USER: academia_admin
  POSTGRES_ADMIN_PASSWORD: TROCAR
  APP_DB_USER: academic_app
  APP_DB_PASSWORD: TROCAR
  NOTIF_DB_USER: notificacoes_app
  NOTIF_DB_PASSWORD: TROCAR
  SECRET_KEY: TROCAR
  ADMIN_PASSWORD: TROCAR
  SECRETARIA_PASSWORD: TROCAR
  PROFESSOR_PASSWORD: TROCAR
