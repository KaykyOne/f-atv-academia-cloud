# AcademiaCloud - projeto integrado dos seis grupos.
#
#  navegador ──► lb (Nginx :APP_PORT) ──► web ×WEB_REPLICAS ──► db (PostgreSQL)
#                                              │ outbox              ▲   ▲
#                                              ▼                     │   │
#                                         publicador ──► notificacoes┘   │
#                                         backup (pg_dump periódico) ────┘──► ./backups
#
# Subir:   docker compose up -d --build
# Parar:   docker compose down        (preserva dados; NÃO use -v)
name: academia-cloud

x-app: &app
  build: .
  image: academia-cloud:${IMAGE_TAG:-2.0}
  networks: [academia]
  # Grupo 3: impede ganho de privilégios (setuid etc.) dentro do container.
  # Obs.: read_only: true não é aceito pelo Compose junto com secrets do tipo
  # "environment" (teste registrado em docs/GRUPO3_SEGURANCA.md).
  security_opt: ["no-new-privileges:true"]
  environment: &app-env
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${POSTGRES_DB:-academia}
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}   # retenção de logs (Grupo 6)

services:
  # ------------------------------------------------------------ banco de dados
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academia}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Crie o arquivo .env (veja .env.example)}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    # Grupo 5: volume NOMEADO -> os dados vivem fora do ciclo de vida do container.
    volumes: [dados_postgres:/var/lib/postgresql/data]
    networks: [academia]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}
    logging: *logging

  # ------------------------------------------------------------ inicialização (termina com código 0)
  init:
    <<: *app
    command: ["python", "-m", "app.init_db"]
    environment:
      <<: *app-env
      DB_USER: ${POSTGRES_ADMIN_USER}
      DB_PASSWORD_FILE: /run/secrets/postgres_admin_password
      APP_DB_USER: ${APP_DB_USER:-academic_app}
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      NOTIF_DB_USER: ${NOTIF_DB_USER:-notificacoes_app}
      NOTIF_DB_PASSWORD_FILE: /run/secrets/notif_db_password
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SECRETARIA_PASSWORD_FILE: /run/secrets/secretaria_password
      PROFESSOR_PASSWORD_FILE: /run/secrets/professor_password
    secrets: [postgres_admin_password, app_db_password, notif_db_password,
              admin_password, secretaria_password, professor_password]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  # ------------------------------------------------------------ aplicação (réplicas stateless)
  web:
    <<: *app
    environment:
      <<: *app-env
      DB_USER: ${APP_DB_USER:-academic_app}          # conta de MENOR privilégio
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      SECRET_KEY_FILE: /run/secrets/secret_key
      NOTIF_URL: http://notificacoes:8001
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    secrets: [app_db_password, secret_key]
    # Sem "ports": só o balanceador é publicado; as réplicas não disputam a porta do host.
    expose: ["8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS:-2}
      resources: {limits: {cpus: "0.50", memory: 256M}}

  # ------------------------------------------------------------ balanceador
  lb:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro
    networks: [academia]
    depends_on:
      web: {condition: service_healthy}   # só recebe tráfego quando as réplicas estão prontas
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/lb/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.25", memory: 64M}}}
    logging: *logging

  # ------------------------------------------------------------ eventos e notificações (Grupo 2)
  notificacoes:
    <<: *app
    command: ["gunicorn", "--bind", "0.0.0.0:8001", "--workers", "1", "--access-logfile", "-", "app.wsgi_notificacoes:app"]
    environment:
      <<: *app-env
      DB_USER: ${NOTIF_DB_USER:-notificacoes_app}
      DB_PASSWORD_FILE: /run/secrets/notif_db_password
    secrets: [notif_db_password]
    expose: ["8001"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.25", memory: 128M}}}

  publicador:
    <<: *app
    command: ["python", "-m", "app.publicador"]
    environment:
      <<: *app-env
      DB_USER: ${APP_DB_USER:-academic_app}
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      NOTIF_URL: http://notificacoes:8001
      PUBLICADOR_INTERVALO: "2"
    secrets: [app_db_password]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:   # heartbeat gravado a cada ciclo; velho demais = travado
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(time.time()-os.path.getmtime('/tmp/publicador.heartbeat')>30)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.25", memory: 128M}}}

  # ------------------------------------------------------------ backup periódico (Grupo 5)
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_ADMIN_USER}
      PGDATABASE: ${POSTGRES_DB:-academia}
      PGPASSWORD_FILE: /run/secrets/postgres_admin_password
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      TZ: UTC
    secrets: [postgres_admin_password]
    volumes:
      - ./infra/backup/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups          # bind mount: backups FORA do volume do banco
    networks: [academia]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.50", memory: 128M}}}
    logging: *logging

  # ------------------------------------------------------------ administração opcional
  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-professor@example.com}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets: [pgadmin_password]
    ports: ["127.0.0.1:${PGADMIN_PORT:-5050}:80"]
    volumes: [dados_pgadmin:/var/lib/pgadmin]
    networks: [academia]
    depends_on:
      db: {condition: service_healthy}

# Grupo 3: segredos entregues como ARQUIVOS em /run/secrets (não aparecem em
# `docker inspect` como variáveis de ambiente do container).
secrets:
  postgres_admin_password: {environment: POSTGRES_ADMIN_PASSWORD}
  app_db_password: {environment: APP_DB_PASSWORD}
  notif_db_password: {environment: NOTIF_DB_PASSWORD}
  secret_key: {environment: SECRET_KEY}
  admin_password: {environment: ADMIN_PASSWORD}
  secretaria_password: {environment: SECRETARIA_PASSWORD}
  professor_password: {environment: PROFESSOR_PASSWORD}
  pgadmin_password: {environment: PGADMIN_PASSWORD}

volumes:
  dados_postgres:
  dados_pgadmin:

networks:
  academia:
    driver: bridge
