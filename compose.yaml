name: academia-cloud
x-app: &app
  build: .
  image: academia-cloud:1.0
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  networks: [academia]
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Crie o arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Crie o arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env}
    volumes: [dados_postgres:/var/lib/postgresql/data]
    networks: [academia]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *app
    command: ["python", "-m", "app.main"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  web:
    <<: *app
    ports: ["127.0.0.1:${APP_PORT:-8080}:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:${PGADMIN_PORT:-5050}:80"]
    volumes: [dados_pgadmin:/var/lib/pgadmin]
    networks: [academia]
    depends_on:
      db: {condition: service_healthy}
volumes:
  dados_postgres:
  dados_pgadmin:
networks:
  academia:
    driver: bridge
